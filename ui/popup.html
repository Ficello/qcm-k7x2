<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>QCM Clavier</title>
  <link rel="stylesheet" href="base.css">
  <style>
    body {
      width: 340px;
      padding: 14px;
      background: var(--surface);
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .popup-brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .popup-brand h1 {
      font-size: 15px;
      font-weight: 600;
    }
    .popup-site {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .popup-site strong {
      color: var(--text);
    }
    .popup-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
    }
    .popup-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-bottom: 1px solid var(--border);
    }
    .popup-row:last-child {
      border-bottom: 0;
    }
    .popup-row-title {
      font-size: 13px;
      font-weight: 500;
    }
    .popup-row-sub {
      font-size: 11px;
      color: var(--muted);
    }
    .popup-empty {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg);
      font-size: 12px;
      color: var(--muted);
    }
    .popup-footer {
      margin-top: 14px;
      display: flex;
    }
    .popup-footer .btn {
      width: 100%;
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="popup-brand">
      <img src="../icons/icon32.png" alt="" width="24" height="24">
      <h1>QCM Clavier</h1>
    </div>
    <label class="switch" title="Activer ou désactiver l'extension">
      <input type="checkbox" id="global-enabled">
      <span class="switch-track"></span>
    </label>
  </header>

  <div id="site-status" class="popup-site"></div>
  <div id="feature-list"></div>

  <footer class="popup-footer">
    <button id="open-options" class="btn btn-primary" type="button">Configurer mes raccourcis</button>
  </footer>

  <script src="../src/core/schema.js"></script>
  <script src="../src/core/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
